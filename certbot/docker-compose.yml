services:
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/letsencrypt-lib:/var/lib/letsencrypt
      - ./data/webroot:/var/www/certbot
      # optional: mount host nginx cert dir if you run renew/copy from compose
      - ${NGINX_CERT_DIR:-/etc/nginx/cert}:/etc/nginx/cert
