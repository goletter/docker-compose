# Common security response headers
#
# Include in each server {} block that serves HTTPS.
# These headers protect against clickjacking, MIME sniffing,
# and protocol downgrade attacks.
#
# Reference: https://owasp.org/www-project-secure-headers/

# HSTS: force HTTPS for 1 year, include subdomains
# Only takes effect over HTTPS; browsers cache this directive
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Prevent clickjacking: disallow embedding in frames from other origins
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing (e.g. treating uploaded .txt as .html)
add_header X-Content-Type-Options "nosniff" always;

# Control referrer information sent to other origins
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features (camera, microphone, geolocation, etc.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;