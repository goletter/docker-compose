# Restore real client IP from Cloudflare
#
# Cloudflare adds CF-Connecting-IP header with visitor's real IP.
# This snippet tells Nginx to trust Cloudflare IPs and extract the
# real client IP from that header, so $remote_addr reflects the
# actual visitor instead of a Cloudflare edge IP.
#
# Reference: https://developers.cloudflare.com/fundamentals/reference/http-headers/
# IP source: https://www.cloudflare.com/ips-v4/ and /ips-v6/
#
# These ranges may change. Sync periodically:
#   curl -s https://www.cloudflare.com/ips-v4/ > /tmp/cf-ipv4.txt
#   curl -s https://www.cloudflare.com/ips-v6/ > /tmp/cf-ipv6.txt

# When cloudflared runs on the same host and proxies to local Nginx,
# Nginx sees the immediate peer as localhost and must trust it before
# it will honor CF-Connecting-IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.29.0.0/16;
set_real_ip_from ::1;

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP (all plans, single IP, recommended by Cloudflare)
# NOT True-Client-IP (Enterprise only)
# NOT X-Forwarded-For (may contain multi-hop proxy chain)
real_ip_header CF-Connecting-IP;
real_ip_recursive on;